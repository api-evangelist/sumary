name: Sumary
description: >-
  Sumary is a Denmark-based fintech building an AI-native workflow engine for
  finance and accounting teams. Its platform layers autonomous accounting
  agents, anomaly detection, and on-demand reporting over a company's existing
  accounting systems — automating reconciliations and variance explanations,
  validating transactions to catch errors and potential fraud, and generating
  management reports, margin analyses, and cost breakdowns for bookkeepers,
  controllers, CFOs, and finance leaders. The company raised a $4.2M (27M DKK)
  pre-seed round led by byFounders with participation from Partech and Tenity.
  No public API, developer portal, or OpenAPI surface has been located; this
  profile captures the company's web, trust, and domain-security surface.
